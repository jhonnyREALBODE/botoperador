<!doctype html><html><head><meta charset="utf-8"><title>PS3838 (falsa)</title>
<style>body{font-family:Arial;margin:0;display:flex}#app{flex:1;padding:10px}.betslip{width:300px;border-left:1px solid #ccc;padding:10px;min-height:400px}
td{border:1px solid #ccc;padding:3px 6px}a.odds{display:inline-block;cursor:pointer;border:1px solid #999;padding:2px 6px;margin:1px;color:#000;text-decoration:none}
.lock-hidden{display:none}.modal{position:fixed;top:30%;left:30%;background:#fff;border:2px solid #000;padding:20px}.slip-sel{border:1px solid #888;padding:4px}
.jogo-lista{display:block;margin:4px;border:1px solid #ddd;padding:4px}</style>
<script>const ESTADO = __ESTADO__;</script><script src="/fakes/dados.js"></script></head><body>
<div id="app"></div>
<div class="BetslipComponent" style="width:300px;border-left:1px solid #ccc;padding:10px;min-height:400px"><div class="betslip-tab active">SIMPLES</div>
<div class="SingleBetComponent"><div class="bet-header"><span class="remove-all" id="rem"><span class="remove-all-icon"></span><span class="remove-all-text">Remover tudo</span></span>
<span class="refresh-all"><span class="refresh-text">Atualizar</span></span></div><div class="bet-body" id="sels"></div>
<div class="bet-footer"><div class="total-stake"><span>Total Stake</span><span>0.00 EUR</span></div><button class="place-bet-btn" id="apostar">Fazer aposta</button><div id="msg"></div></div></div></div>
<script>
const p = location.pathname; const app = document.getElementById('app');
let sel = null;
function render() {
  const s = document.getElementById('sels'); s.innerHTML = '';
  if (!sel) return;
  s.innerHTML = '<div class="bet-body-item"><div class="BetItemComponent" data-id="' + sel.aid + '"><div class="BetItemContent"><div class="remove-icon"></div>' +
    '<div class="title"><div class="live-label">Ao vivo</div><div class="bet-event"><span class="team1">' + sel.t1 + '</span><span class="vs"> vs </span><span class="team2">' + sel.t2 + '</span></div></div>' +
    '<div class="bet-extra-info">2026-11-14 ' + sel.mk + ' - ' + sel.per + ' - NBA</div><div class="team"><div class="odds-info-container"><span class="odds-info"><span class="at">@</span><span class="odds"> ' + sel.odd + '</span></span></div>' +
    '<div class="selection-container"><span class="selection">' + sel.rot + '  </span></div></div>' +
    '<div class="multi-stake-stretch"><input name="risk" class="input-stake stake risk" placeholder="Aposta" inputmode="decimal" type="text"><input name="win" class="input-stake stake win" placeholder="Ganho" type="text"></div>' +
    '<div class="quick-stakes-wrapper"><button class="btn-stake">+45</button><button class="btn-stake">+225</button></div><div class="min-max-bet"><span>Aposta mín.</span><span>5.00</span><span>Aposta máx.</span><span>2,517.40</span></div></div></div></div>';
  const stake = s.querySelector('input[name=risk]');
  stake.addEventListener('change', () => { const v = parseFloat(stake.value.replace(/,/g, '')); if (!isNaN(v)) stake.value = v.toFixed(2); });
  s.querySelector('.remove-icon').onclick = () => { sel = null; render(); };
}
document.getElementById('rem').onclick = () => {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = 'Quer limpar o boletim? <button id="okm">OK</button> <button id="canc">Cancelar</button>';
  document.body.appendChild(m);
  m.querySelector('#okm').onclick = () => { sel = null; render(); m.remove(); };
  m.querySelector('#canc').onclick = () => m.remove();
};
document.getElementById('apostar').onclick = () => { if (sel) document.getElementById('msg').textContent = 'Aposta aceita'; };
const PERS = {0: 'Jogo', 1: '1º Tempo', 3: '1º Quarto', 4: '2º Quarto', 6: '4º Quarto'};
if (ESTADO.limite) {
  app.innerHTML = '<h2>Excesso de requisições</h2><p>Tente novamente mais tarde.</p>';
} else if (p.indexOf('/matchup/') >= 0) {
  const id = p.split('/').pop(); const j = JOGOS[id];
  let h = '<div class="ScoreboardBreadcrumb"><div><a>' + (ESTADO.liga_errada ? 'Espanha - ACB' : j.ligaps) + '</a><span>&nbsp;/&nbsp;</span></div><div><a>' + j.t1 + ' -vs- ' + j.t2 + '</a></div></div>' +
          '<div>Ao vivo</div><div>' + j.t1 + '</div><div>' + j.t2 + '</div>';
  if (ESTADO.deslogado) h += '<div><button>Entrar</button></div>';
  h += '<table class="events"><tbody>';
  for (const linha of ancorasPS(j)) {
    h += '<tr class="mkline"><td><span class="liveInfo">' + relogioPS() + '</span></td><td class="match-up-details" data-home-team="' + j.t1 + '" data-away-team="' + j.t2 + '"><span>' + j.t1 + '</span> <span>' + j.t2 + '</span></td>';
    for (const [per, mer, lado, ln, odd, trav] of linha) {
      const pref = mer === 3 ? (lado === 3 ? ln.toFixed(1) : 'u') : (lado === 0 ? Math.abs(ln).toFixed(1) : '&nbsp;');
      h += '<td class="col-' + (mer === 2 ? 'hdp' : 'ou') + '" data-period="' + per + '"><div class="odds"><a class="odds enhanced-odd" id="' + id + '|' + per + '|' + mer + '|' + lado + '|1|' + ln + '">' +
           '<div class="hdp"><p class="prefix-hdp">' + pref + ' </p></div> ' + (ESTADO.deslogado ? '' : '<span>' + odd + '</span>') + '</a>' +
           '<div class="style-lock' + (trav ? '' : ' lock-hidden') + '"><i class="icon icon-lock"></i></div></div></td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  app.innerHTML = h;
  document.querySelectorAll('a.odds').forEach(a => a.onclick = () => {
    if (a.parentElement.querySelector('.style-lock:not(.lock-hidden)')) return;
    const [ev, per, mer, lado, alt, ln] = a.id.split('|');
    const odd = a.querySelector('span').innerText;
    const l = parseFloat(ln);
    let rot, mk;
    if (mer === '3') { rot = (lado === '3' ? 'Mais de ' : 'Menos de ') + l.toFixed(1); mk = 'OU'; }
    else { rot = (lado === '0' ? j.t1 : j.t2) + ' ' + (l > 0 ? '+' : '') + l; mk = 'HDP'; }
    sel = {aid: a.id, t1: j.t1, t2: j.t2, per: PERS[per] || per, mk, rot, odd}; render();
  });
  if (ESTADO.sujo) { sel = {aid: '999|0|3|3|0|150.5', t1: 'Outro', t2: 'Jogo', per: 'Jogo', mk: 'OU', rot: 'Mais de 150.5', odd: '1.900'}; render(); }
} else {
  let h = '<h2>Basquete</h2>';
  for (const id of Object.keys(JOGOS)) {
    const j = JOGOS[id];
    h += '<a class="jogo-lista" href="/pt/sports/basketball/matchup/' + encodeURIComponent(j.ligaps.replace(/ /g, '-')) + '/' + j.t1.replace(/\W+/g, '-') + '-vs-' + j.t2.replace(/\W+/g, '-') + '/487/' + id + '">' + j.t1 + '<br>' + j.t2 + '</a>';
    h += '<div>1º Tempo — Acima 105.5 <span>1.90</span></div>';
  }
  app.innerHTML = h;
}
</script></body></html>
